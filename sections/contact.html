<section id="contact" class="py-24 px-6 bg-sky-700">
  <div class="max-w-3xl mx-auto">
    <h2 class="text-4xl font-bold text-center mb-12 text-cyan-400">
      Contact Me
    </h2>

    <form class="space-y-6">
      <input type="text" name="name" required maxlength="100" placeholder="Name" class="w-full px-4 py-3 rounded-xl bg-sky-900" />
      <input type="email" name="email" required maxlength="255" placeholder="Email" class="w-full px-4 py-3 rounded-xl bg-sky-900" />
      <textarea name="message" rows="5" maxlength="2000" placeholder="Message" class="w-full px-4 py-3 rounded-xl bg-sky-900"></textarea>

      <button type="submit" class="bg-cyan-400 text-black px-6 py-3 rounded-xl font-semibold">
        Send Message
      </button>
    </form>

    <p id="contact-status" class="hidden text-center text-lg mt-6" role="status"></p>
  </div>
</section>

<script>
  const contactForm = document.querySelector("#contact form");
  const contactStatus = document.querySelector("#contact-status");
  const contactButton = contactForm.querySelector("button");

  contactForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    contactStatus.classList.add("hidden");
    contactButton.disabled = true;

    try {
      const response = await fetch("/api/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: contactForm.name.value.trim(),
          email: contactForm.email.value.trim(),
          message: contactForm.message.value.trim(),
        }),
      });

      const result = await response.json();

      if (!response.ok) {
        contactStatus.textContent = result.error || "Your message could not be recorded. Please try again.";
        contactStatus.className = "text-center text-lg mt-6 text-red-300";
        return;
      }

      contactForm.reset();
      contactStatus.textContent = "Thank you. Your message has been sent and recorded.";
      contactStatus.className = "text-center text-lg mt-6 text-cyan-300";
    } catch (error) {
      contactStatus.textContent = "Your message could not be recorded. Please try again.";
      contactStatus.className = "text-center text-lg mt-6 text-red-300";
    } finally {
      contactButton.disabled = false;
    }
  });
</script>
